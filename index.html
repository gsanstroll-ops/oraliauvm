<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D59">
<title>OralIA · Prototipo TRL-2 navegable</title>
<style>
:root{--navy:#0B3D59;--teal:#127475;--teal-d:#0E5E5F;--coral:#FF6B4A;--coral-s:#B93F27;--bg:#F3F6F7;--card:#fff;--line:#D5DEE2;--text:#17262E;--muted:#4F5F69;--ok:#2E7D32;--warn:#F2B705;--bad:#C62828;--r:12px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.skip{position:absolute;left:-9999px;top:0}
.skip:focus{left:8px;top:8px;background:#fff;color:var(--navy);padding:10px;z-index:99;border-radius:8px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.appbar{position:sticky;top:0;z-index:6;background:var(--navy);color:#fff;display:flex;align-items:center;gap:6px;padding:6px 10px;min-height:56px;padding-top:max(6px,env(safe-area-inset-top))}
.appbar h1{font-size:18px;margin:0;flex:1;text-align:center;font-weight:700;letter-spacing:.2px}
.iconbtn{background:transparent;border:0;color:#fff;min-width:44px;min-height:44px;border-radius:10px;font-size:22px;cursor:pointer;line-height:1}
.iconbtn[hidden]{display:inline-block;visibility:hidden}
.net{font-size:12px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.16);white-space:nowrap}
.net.off{background:#B93F27}
.layout{display:block}
.sidenav{display:none}
main{padding:16px 16px 104px;outline:none;min-height:calc(100vh - 56px)}
.wrap{max-width:760px;margin:0 auto}
.narrow{max-width:440px;margin:0 auto}
h2{font-size:22px;margin:4px 0 10px;color:var(--navy)}
h3{font-size:17px;margin:18px 0 8px;color:var(--navy)}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.row{display:flex;gap:10px}
.row>*{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:10px;border:2px solid transparent;font-weight:700;font-size:16px;cursor:pointer;width:100%;text-decoration:none;font-family:inherit;margin:6px 0}
.btn.primary{background:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-d)}
.btn.cta{background:var(--coral-s);color:#fff;font-size:18px;min-height:56px}
.btn.cta:hover{background:#9E3420}
.btn.outline{background:#fff;color:var(--teal-d);border-color:var(--teal)}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--line)}
.btn.danger{background:#fff;color:#A11B1B;border-color:#C62828}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:44px;font-size:15px;padding:8px 12px;width:auto}
:focus-visible{outline:3px solid #F2B705;outline-offset:2px}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid #7D8E97;border-radius:10px;font-size:16px;background:#fff;color:var(--text);font-family:inherit}
textarea{min-height:90px}
input[type=range]{width:100%;min-height:44px;accent-color:var(--teal)}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0}
.check input{width:24px;height:24px;margin:1px 0 0;accent-color:var(--teal);flex:none}
.check label{font-weight:500;margin:0}
.error{color:#A11B1B;font-weight:600;margin:8px 0}
.error:empty{display:none}
.field-error{color:#A11B1B;font-size:14px;font-weight:600;margin-top:4px}
.field-error:empty{display:none}
.card.correo{margin:12px 0;display:grid;gap:8px}
.card.correo[hidden]{display:none}
.card.correo ul{margin:0;padding-left:20px}
.clave{font-family:ui-monospace,Consolas,monospace;font-size:20px;letter-spacing:1px;user-select:all}
.alert{border-radius:10px;padding:12px 14px;margin:10px 0;border:1.5px solid}
.alert:empty{display:none}
.alert.bad{background:#FDECEA;border-color:#E57368;color:#7A1A10}
.alert.ok{background:#E8F5E9;border-color:#66BB6A;color:#1B5E20}
.alert.info{background:#E6F2F2;border-color:#76B7B8;color:#0B3D59}
.alert.warn{background:#FFF6DA;border-color:#E2B33C;color:#5A4300}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px;white-space:nowrap}
.badge.Bajo{background:var(--ok);color:#fff}
.badge.Moderado{background:var(--warn);color:#2B2000}
.badge.Alto{background:var(--bad);color:#fff}
.badge.neutral{background:#E3EAED;color:#24343C}
.chip{display:inline-block;font-size:13px;padding:3px 9px;border-radius:99px;background:#E6F2F2;color:#0B3D59;font-weight:600}
.step{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 6px}
.list{list-style:none;margin:0;padding:0}
.list li{margin:8px 0}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;min-height:56px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.item:hover{border-color:var(--teal)}
.item[aria-current=true]{border:2px solid var(--teal);background:#F2FAFA}
.camera{position:relative;aspect-ratio:4/3;background:#E9EEF0;border:2px dashed #7D8E97;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.camera .oval{position:absolute;width:60%;height:78%;border:3px dashed var(--coral);border-radius:50%;pointer-events:none}
.camera img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.guide{list-style:none;padding:0;margin:10px 0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.guide li{display:flex;gap:6px;align-items:center}
.guide .s{font-weight:700}
.guide .s.ok{color:#1B5E20}
.guide .s.no{color:#A11B1B}
.guide .s.na{color:var(--muted)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px;margin:8px 0}
.metrics dt{color:var(--muted)}
.metrics dd{margin:0;font-weight:700}
.progress{height:12px;background:#DCE5E8;border-radius:99px;overflow:hidden;margin:14px 0}
.progress>div{height:100%;width:0;background:var(--teal);transition:width .25s}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:10px;align-items:center;margin:10px 0}
.steps .dot{width:26px;height:26px;border-radius:50%;border:2px solid #7D8E97;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--muted);flex:none}
.steps li.done .dot{background:var(--teal);border-color:var(--teal);color:#fff}
.figure{position:relative;border-radius:12px;overflow:hidden;background:#000}
.figure canvas{display:block;width:100%;height:auto}
.toggles{display:flex;flex-wrap:wrap;gap:4px 16px}
.toggles .check{margin:8px 0}
.risk{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.risk .badge{font-size:18px;padding:8px 18px}
.disclaimer{background:#FFF8F0;border:1.5px solid #E7A27D;border-radius:10px;padding:12px;color:#5A2A12;font-weight:600;margin:10px 0}
.timeline{margin:6px 0 0;padding-left:20px;font-size:14px}
.timeline li{margin:4px 0}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:6}
.bottomnav a{flex:1;text-align:center;color:var(--muted);text-decoration:none;font-size:13px;padding:4px 2px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:8px}
.bottomnav a[aria-current=page]{color:var(--teal-d);font-weight:700}
.bottomnav svg,.sidenav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin:18px 0 8px}
.brand .logo{width:64px;height:64px;border-radius:18px;background:var(--navy);display:flex;align-items:center;justify-content:center}
.brand b{font-size:26px;color:var(--navy)}
.lead{text-align:center;color:var(--muted);font-size:17px}
details{background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 12px;margin:10px 0}
details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--navy)}
.table-wrap{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#17262E;color:#fff;padding:12px 16px;border-radius:10px;max-width:92vw;z-index:20;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.toast:empty{display:none}
.banner{background:#B93F27;color:#fff;padding:10px 14px;font-weight:600;font-size:14px;text-align:center}
.banner:empty{display:none}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:24px;color:var(--navy)}
.split{display:block}
.pane-empty{color:var(--muted);text-align:center;padding:40px 10px}
@media (min-width:900px){
  .appbar h1{text-align:left;padding-left:8px}
  .layout{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 56px)}
  .layout.nonav{display:block}
  .sidenav{display:block;background:#0E4A6B;padding:14px 10px}
  .sidenav a{display:flex;gap:12px;align-items:center;color:#E6F0F5;text-decoration:none;padding:12px;border-radius:10px;font-weight:600;min-height:48px;margin:4px 0}
  .sidenav a:hover{background:rgba(255,255,255,.08)}
  .sidenav a[aria-current=page]{background:#fff;color:var(--navy)}
  .sidenav .who{color:#CFE2EA;font-size:13px;padding:6px 12px 14px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:8px}
  .bottomnav{display:none}
  main{padding:24px 32px 40px}
  .toast{bottom:28px}
  .split{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:22px;align-items:start}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .pc-two{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
}

.helpbtn{background:rgba(255,255,255,.18);border:0;color:#fff;min-height:40px;border-radius:99px;font-weight:700;font-size:15px;cursor:pointer;padding:0 12px;white-space:nowrap}
.helpbtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.primera{display:flex;gap:12px;align-items:center;background:#E6F2F2;border:1.5px solid #76B7B8;border-radius:var(--r);padding:12px 14px;margin:12px 0;color:var(--navy);text-decoration:none;font-weight:600}
.primera .ic{flex:0 0 36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.demo-rapido{display:grid;gap:10px;margin:14px 0 4px}
.demo-rapido .btn{width:100%}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:18px 0 6px}
.sep::before,.sep::after{content:"";flex:1;border-top:1px solid var(--line)}
.pasos{list-style:none;padding:0;margin:12px 0;display:grid;gap:10px}
.pasos li{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.pasos .n{flex:0 0 36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:18px}
.pasos b{display:block;color:var(--navy)}
.colores{display:grid;gap:8px;margin:10px 0}
.colores div{display:flex;gap:10px;align-items:center}
.resumen{border-radius:var(--r);padding:14px;margin:10px 0;border:2px solid;font-size:16px}
.resumen b{display:block;font-size:19px;margin-bottom:4px}
.resumen.Bajo{background:#E8F5E9;border-color:#66BB6A;color:#1B5E20}
.resumen.Moderado{background:#FFF6DA;border-color:#E2B33C;color:#5A4300}
.resumen.Alto{background:#FDECEA;border-color:#E57368;color:#7A1A10}
.envio{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.envio .btn{width:100%;margin-top:8px}
.net.nube{background:#2E7D32}
#textoCorreo{width:100%;margin-top:8px;font:14px/1.4 system-ui,sans-serif;border:1px solid var(--line);border-radius:10px;padding:8px}
</style>
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>
<header class="appbar">
  <button class="iconbtn" id="btnBack" type="button" aria-label="Volver" hidden>&#8592;</button>
  <h1 id="appTitle">OralIA</h1>
  <button class="helpbtn" id="btnAyuda" type="button" aria-label="Cómo funciona OralIA">? Ayuda</button>
  <span class="net" id="net" role="status">En línea</span>
</header>
<div class="banner" id="banner" role="status" aria-live="polite"></div>
<div class="layout" id="layout">
  <nav class="sidenav" id="sidenav" aria-label="Navegación principal"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Navegación inferior" hidden></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  umbrales: {nitidez_min: 24, contraste_min: 24, brillo_min: 60, brillo_max: 200, saturada_max: 0.2, lado_min: 256},
  async validarFormato(file){
    const head = new Uint8Array(await file.slice(0, 12).arrayBuffer());
    const jpg = head[0] === 0xFF && head[1] === 0xD8 && head[2] === 0xFF;
    const png = head[0] === 0x89 && head[1] === 0x50 && head[2] === 0x4E && head[3] === 0x47 && head[4] === 0x0D && head[5] === 0x0A && head[6] === 0x1A && head[7] === 0x0A;
    const mimeOk = !file.type || file.type === 'image/jpeg' || file.type === 'image/png';
    if (!(jpg || png) || !mimeOk) return {ok: false, motivo: 'Formato no permitido: solo se aceptan fotografías JPG o PNG.'};
    return {ok: true, formato: jpg ? 'JPG' : 'PNG'};
  },
  medir(img){
    const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
    const sc = Math.min(1, 512 / Math.max(w0, h0));
    const w = Math.max(1, Math.round(w0 * sc)), h = Math.max(1, Math.round(h0 * sc));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d', {willReadFrequently: true});
    x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
    x.drawImage(img, 0, 0, w, h);
    const d = x.getImageData(0, 0, w, h).data;
    const g = new Float32Array(w * h);
    let s1 = 0, s2 = 0, sat = 0;
    for (let i = 0, j = 0; i < d.length; i += 4, j++){
      const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      g[j] = y; s1 += y; s2 += y * y; if (y >= 250) sat++;
    }
    const n = w * h, media = s1 / n, std = Math.sqrt(Math.max(0, s2 / n - media * media));
    let l1 = 0, l2 = 0, m = 0;
    for (let yy = 1; yy < h - 1; yy++) for (let xx = 1; xx < w - 1; xx++){
      const k = yy * w + xx; const L = g[k - w] + g[k + w] + g[k - 1] + g[k + 1] - 4 * g[k];
      l1 += L; l2 += L * L; m++;
    }
    const lm = m ? l1 / m : 0, lv = m ? l2 / m - lm * lm : 0;
    return {nitidez_score: round4(lv), contraste_score: round4(std), brillo: round4(media), frac_saturada: round4(sat / n), ancho: w0, alto: h0, resolucion: w0 + '×' + h0};
  },
  evaluar(met){
    const u = this.umbrales, motivos = [];
    if (Math.min(met.ancho, met.alto) < u.lado_min) motivos.push('resolucion');
    if (met.brillo < u.brillo_min) motivos.push('oscura');
    if (met.brillo > u.brillo_max || met.frac_saturada > u.saturada_max) motivos.push('sobreexpuesta');
    if (met.nitidez_score < u.nitidez_min) motivos.push('borrosa');
    if (met.contraste_score < u.contraste_min) motivos.push('bajo_contraste');
    return {apta: motivos.length === 0, motivos};
  },
  validarCalidad(img){ const met = this.medir(img); return Object.assign(met, this.evaluar(met)); },
  textos: {
    borrosa: 'Imagen borrosa: apoye los codos, acerque la cámara a 10-15 cm y espere a que enfoque.',
    oscura: 'Poca luz: use la linterna del teléfono o acérquese a una ventana.',
    sobreexpuesta: 'Imagen sobreexpuesta: evite el flash directo y los reflejos.',
    bajo_contraste: 'Contraste insuficiente: limpie el lente y evite la luz de fondo.',
    resolucion: 'Resolución insuficiente: use la cámara trasera o una foto de mayor tamaño.',
    no_boca: 'No parece una foto de la boca: abra bien la boca y acerque la cámara a la lesión, a 10 o 15 cm.'
  }
};

/* ------------------------- AI Inference Engine (RF-04, RF-07): InceptionV3 entrenado ------------------------- */
function boxBlurF(a, w, h, r){
  const t = new Float32Array(a.length);
  for (let y = 0; y < h; y++){ let acc = 0, cnt = 0;
    for (let x = -r; x < w + r; x++){
      if (x + r < w){ acc += a[y * w + x + r]; cnt++; }
      if (x - r - 1 >= 0){ acc -= a[y * w + x - r - 1]; cnt--; }
      if (x >= 0 && x < w) t[y * w + x] = acc / cnt;
    } }
  for (let x = 0; x < w; x++){ let acc = 0, cnt = 0;
    for (let y = -r; y < h + r; y++){
      if (y + r < h){ acc += t[(y + r) * w + x]; cnt++; }
      if (y - r - 1 >= 0){ acc -= t[(y - r - 1) * w + x]; cnt--; }
      if (y >= 0 && y < h) a[y * w + x] = acc / cnt;
    } }
}

async function recursoTexto(id){

  if (el) return el.textContent;
  const partes = (window.ORALIA_RECURSOS || {})[id];
  if (!partes) throw err(503, 'Falta el recurso ' + id + ' del motor de IA.');
  const textos = await Promise.all(partes.map(u => fetch(u).then(r => { if (!r.ok) throw err(503, 'No se pudo descargar ' + u); return r.text(); })));

async function recursoBytes(id){

  const partes = (window.ORALIA_RECURSOS || {})[id];
  if (!partes) throw err(503, 'Falta el recurso ' + id + ' del motor de IA.');
  const datos = await Promise.all(partes.map(u => fetch(u).then(r => { if (!r.ok) throw err(503, 'No se pudo descargar ' + u); return /\.txt$/i.test(u) ? r.text() : r.arrayBuffer(); })));
  if (typeof datos[0] === 'string') return base64ABytes(datos.join(''));
  const n = datos.reduce((t, b) => t + b.byteLength, 0); const out = new Uint8Array(n); let o = 0;
  for (const b of datos){ out.set(new Uint8Array(b), o); o += b.byteLength; }

function bilineal(m, n, N){
  const out = new Float32Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    const fy = clamp((y + .5) * n / N - .5, 0, n - 1), fx = clamp((x + .5) * n / N - .5, 0, n - 1);
    const y0 = Math.floor(fy), x0 = Math.floor(fx), y1 = Math.min(n - 1, y0 + 1), x1 = Math.min(n - 1, x0 + 1), ty = fy - y0, tx = fx - x0;
    out[y * N + x] = (m[y0 * n + x0] * (1 - tx) + m[y0 * n + x1] * tx) * (1 - ty) + (m[y1 * n + x0] * (1 - tx) + m[y1 * n + x1] * tx) * ty;
  }
  return out;
}
/* Zona de mayor activación: elipse ajustada (momentos) a la región Grad-CAM ≥ 50% del máximo. No es la segmentación U-Net. */
function contornoDesdeMapa(mapa){
  const N = 32, g = bilineal(mapa, 8, N); let s = 0, sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){ if (g[y * N + x] >= 0.5){ s++; sx += x; sy += y; sxx += x * x; syy += y * y; sxy += x * y; } }
  if (s < 3) return null;
  const mx = sx / s, my = sy / s, cxx = sxx / s - mx * mx, cyy = syy / s - my * my, cxy = sxy / s - mx * my;
  const tr = cxx + cyy, det = cxx * cyy - cxy * cxy, disc = Math.sqrt(Math.max(0, tr * tr / 4 - det));
  return {cx: round3((mx + .5) / N), cy: round3((my + .5) / N), rx: round3(2 * Math.sqrt(Math.max(tr / 2 + disc, .25)) / N), ry: round3(2 * Math.sqrt(Math.max(tr / 2 - disc, .25)) / N), ang: round3(.5 * Math.atan2(2 * cxy, cxx - cyy))};
}
const AIEngine = {
  version_modelo: MODELO.version,
  estado: 'sin_cargar', error: null, sesion: null, carga_ms: null, _carga: null,
  cargar(){
    if (this._carga) return this._carga;
    this.estado = 'cargando'; avisarIA();
    this._carga = (async () => {
      const t0 = performance.now();
      if (!window.ort) throw err(503, 'No se encontró onnxruntime-web.');
      ort.env.wasm.numThreads = 1; ort.env.wasm.proxy = false;
      ort.env.wasm.wasmBinary = await recursoBytes('oralia-ort-wasm');
      const glue = await recursoTexto('oralia-ort-glue');

      this.sesion = await ort.InferenceSession.create(await recursoBytes('oralia-modelo'), {executionProviders: ['wasm'], graphOptimizationLevel: 'all'});
      this.carga_ms = Math.round(performance.now() - t0); this.estado = 'listo'; avisarIA();

  /* Igual que en el entrenamiento: lado corto a 400 px (si es mayor) y luego 299 × 299 sin recorte, normalizado con ImageNet. */

    let fuente = img; const sc = MODELO.lado_reduccion / Math.min(w0, h0);
    if (sc < 1){ const c = lienzo(Math.max(1, Math.round(w0 * sc)), Math.max(1, Math.round(h0 * sc))); const x = c.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, c.width, c.height); fuente = c; }

  /* Detector de fotos fuera de distribución: el grafo entrega «ood», el error relativo con que las 64 componentes

  },
  async inferir(img, {precalculado = null} = {}){
    if (!Config.iaDisponible) throw err(503, 'El motor de IA no está disponible en este momento.');
    if (precalculado) return Object.assign({}, precalculado, {contorno: contornoDesdeMapa(precalculado.mapa_cam)});

  }
};

/* ------------------------- Risk Engine (RF-06) ------------------------- */
const RiskEngine = {
  pesos: {ia: 0.6, cuestionario: 0.4},
  umbrales: {moderado: 0.35, alto: 0.60},
  puntajeCuestionario(f){
    let q = 0;
    if (f.consumo_tabaco) q += 0.25;
    q += f.consumo_alcohol === 'Frecuente' ? 0.15 : f.consumo_alcohol === 'Ocasional' ? 0.05 : 0;
    q += f.tiempo_evolucion === 'Más de 4 semanas' ? 0.25 : f.tiempo_evolucion === 'Entre 2 y 4 semanas' ? 0.15 : 0;
    if (f.sangrado) q += 0.15;
    q += 0.10 * clamp(Number(f.dolor_eva) || 0, 0, 10) / 10;
    if (Number(f.edad) >= 40) q += 0.10;
    return round4(Math.min(1, q));
  },
  orden: ['Bajo', 'Moderado', 'Alto'],
  nivelIA(prob){ return prob >= MODELO.umbral_alto ? 'Alto' : prob >= MODELO.umbral ? 'Moderado' : 'Bajo'; },
  estratificar(prob, f){
    const q = this.puntajeCuestionario(f);
    const score = round4(this.pesos.ia * prob + this.pesos.cuestionario * q);
    const nivelScore = score >= this.umbrales.alto ? 'Alto' : score >= this.umbrales.moderado ? 'Moderado' : 'Bajo';
    const nivel_ia = this.nivelIA(prob);
    /* La IA fija un nivel mínimo, para no perder la sensibilidad de 90% del modelo; el cuestionario solo puede subirlo. */
    const nivel = this.orden[Math.max(this.orden.indexOf(nivelScore), this.orden.indexOf(nivel_ia))];
    return {puntaje_cuestionario: q, score_unificado: score, nivel_ia, nivel_riesgo: nivel};
  }
};

  const img = await cargarImagen(e.dataUrl); const c = lienzo(img.naturalWidth, img.naturalHeight); c.getContext('2d').drawImage(img, 0, 0);
  if (desenfoque > 0) desenfocarCanvas(c, desenfoque);
  if (brillo !== 1) ajustarBrillo(c, brillo);
  return c;
}
const CALIDAD_FOTO = 0.95;  // calidad JPEG de la foto guardada para el análisis
const aDataUrl = (c, q = .86) => c.toDataURL('image/jpeg', q);
function cargarImagen(src){ return new Promise((ok, mal) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => mal(err(422, 'No se pudo leer la imagen.')); im.src = src; }); }
async function reducir(img, maxLado = 720){
  const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height; const sc = Math.min(1, maxLado / Math.max(w0, h0));
  const c = lienzo(Math.round(w0 * sc), Math.round(h0 * sc)); const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, c.width, c.height); return aDataUrl(c, CALIDAD_FOTO);
}

const PdfCripto = {

  cat(...ps){ const o = new Uint8Array(ps.reduce((t, p) => t + p.length, 0)); let i = 0; for (const p of ps){ o.set(p, i); i += p.length; } return o; },
  hex(b){ return Array.from(b, v => v.toString(16).padStart(2, '0')).join(''); },
  async sha(bits, d){ return new Uint8Array(await crypto.subtle.digest('SHA-' + bits, d)); },
  async aes(clave, iv, datos){ const k = await crypto.subtle.importKey('raw', clave, {name: 'AES-CBC'}, false, ['encrypt']); return new Uint8Array(await crypto.subtle.encrypt({name: 'AES-CBC', iv}, k, datos)); },
  async aesSinRelleno(clave, iv, datos){ return (await this.aes(clave, iv, datos)).slice(0, datos.length); },
  async hash2B(pw, sal, u){
    let K = await this.sha(256, this.cat(pw, sal, u));

      const uno = this.cat(pw, K, u), K1 = new Uint8Array(uno.length * 64); for (let i = 0; i < 64; i++) K1.set(uno, i * uno.length);
      const E = await this.aesSinRelleno(K.slice(0, 16), K.slice(16, 32), K1);
      let m = 0; for (let i = 0; i < 16; i++) m += E[i];
      K = await this.sha([256, 384, 512][m % 3], E);

    }

  },
  bytesClave(clave){ return new TextEncoder().encode(String(clave)).slice(0, 127); },
  async preparar(clave){

    const uvs = this.rnd(8), uks = this.rnd(8), U = this.cat(await this.hash2B(pw, uvs, nada), uvs, uks);
    const UE = await this.aesSinRelleno(await this.hash2B(pw, uks, nada), cero, fk);

    const OE = await this.aesSinRelleno(await this.hash2B(opw, oks, U), cero, fk);

    return {fk, dic, U, id: this.hex(this.rnd(16))};
  },
  async cifrar(fk, datos){ const iv = this.rnd(16); return this.cat(iv, await this.aes(fk, iv, Uint8Array.from(datos))); },
  async comprobar(clave, U){ const h = await this.hash2B(this.bytesClave(clave), U.slice(32, 40), new Uint8Array(0)); return h.every((v, i) => v === U[i]); }
};
const Report = {
  winAnsi(s){
    const map = {'–':0x96,'—':0x97,'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'•':0x95,'…':0x85,'€':0x80};
    const out = [];
    for (const ch of String(s)){
      let c = ch.codePointAt(0);
      if (map[ch]) c = map[ch];
      else if (ch === '≥'){ out.push(0x3E, 0x3D); continue; }
      else if (ch === '≤'){ out.push(0x3C, 0x3D); continue; }
      else if (ch === '×'){ c = 0xD7; }
      else if (c > 255) c = 0x3F;
      if (c === 0x28 || c === 0x29 || c === 0x5C) out.push(0x5C);
      out.push(c);
    }
    return out;
  },

      cont.push(...this.winAnsi(l.t)); C(') Tj ET\n');
    }
    if (imagen) C(`q ${imagen.dw} 0 0 ${imagen.dh} ${imagen.dx} ${imagen.dy} cm /Im1 Do Q\n`);
    const objs = [];
    objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
    objs[2] = '<< /Type /Pages /Kids [3 0 R] /Count 1 >>';
    objs[3] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R /F2 5 0 R >>${imagen ? ' /XObject << /Im1 6 0 R >>' : ''} >> /Contents 7 0 R >>`;
    objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    objs[5] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';

    const sImg = imagen ? (cr ? await PdfCripto.cifrar(cr.fk, imagen.bytes) : imagen.bytes) : null;
    const sCont = cr ? await PdfCripto.cifrar(cr.fk, cont) : cont;

    const offs = [];

  },

function requiere(...roles){
  if (!S.sesion || S.sesion.mfaPendiente) throw err(401, 'Sesión no iniciada.');
  if (roles.length && !roles.includes(S.sesion.rol)) throw err(403, `Acceso denegado: el rol ${S.sesion.rol} no tiene permiso para esta operación.`);
}
const lat = ms => Config.latencia ? sleep(ms) : Promise.resolve();

const pacienteActual = () => { const u = usuarioActual(); return u && S.pacientes.find(p => p.id_paciente === u.id_paciente); };

  const id_paciente = nuevoId('P');
  const id_clinico = 'OIA-' + fnv1a(id_paciente + ':oralia:' + rut).toString(16).toUpperCase().padStart(8, '0').slice(0, 6);

}

const Sync = {

    this.enCurso = true;

/* ------------------------- Datos compartidos (base de datos del artefacto de Claude) -------------------------
   Cada registro es un documento: usuarios/U-0001, fichas/F-0004-K7Q, etc. La sesión, el borrador y la cola
   quedan en el dispositivo. S.nube.base guarda la huella de la versión que este dispositivo sabe que está en la base:
   si el registro local cambió, se sube; si no cambió, gana la versión remota. */

/* Base de datos en internet (OralIA API en Neon): misma forma que la base del artefacto (collection/onSnapshot y doc/set/delete/get).
   Cada 3 segundos pide los cambios desde la última revisión y avisa a cada colección suscrita. */

  try {
    const ctl = typeof AbortController === 'function' ? new AbortController() : null; const t = setTimeout(() => ctl && ctl.abort(), 3500);
    const r = await fetch(base + '/', {cache: 'no-store', signal: ctl ? ctl.signal : undefined}); clearTimeout(t); return r.ok;
  } catch (e){ return false; }
}

      if (!cambios.length && s.listo) continue;

      try { s.next({docs, size: docs.length, empty: !docs.length, metadata: {fromCache: false, hasPendingWrites: false}, docChanges: () => cambios}); } catch (e) { console.warn(e); }
    }

    if (enCurso || (primera && document.hidden)) return;
    enCurso = true;

      const tocadas = new Set(); let mas = true, vueltas = 0;
      while (mas && vueltas++ < 50){
        const r = await fetch(base + '/cambios?desde=' + Math.max(0, cursor - 20), {cache: 'no-store'});
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json(); let avanzo = false;
        for (const x of j.docs || []){ const m = datos[x.c] = datos[x.c] || {}; if (x.d == null) delete m[x.id]; else m[x.id] = x.d; if (x.rev > cursor){ cursor = x.rev; avanzo = true; } tocadas.add(x.c); }
        mas = !!j.mas && avanzo;
      }
      for (const c in subs) if (!primera || tocadas.has(c)) emitir(c);
      primera = true;
      if (fallas){ fallas = 0; if (alReconectar) alReconectar(); }
    } catch (e){ fallas++; }
    finally { enCurso = false; }
  };
  const ruta = path => { const i = path.indexOf('/'); return base + '/doc?c=' + encodeURIComponent(path.slice(0, i)) + '&id=' + encodeURIComponent(path.slice(i + 1)); };

    collection: c => ({

    }),
    doc: path => ({

      async get(){ const r = await fetch(ruta(path), {cache: 'no-store'}); if (!r.ok) throw falla(r); const j = await r.json(); return snapDoc(path.split('/').pop(), j.exists ? j.d : null); }
    })

}

function router(){
  const h = Nav.actual();
  const r = rutas.find(x => x.p.test(h));
  if (!r){ Nav.ir(S.sesion ? '#/inicio' : '#/login'); return; }
  if (r.libre){ try { render(r.v()); } catch (x){ toast(x.message); } return; }
  rutaPrevia = h;
  if (r.publico && S.sesion && !S.sesion.mfaPendiente){ Nav.ir('#/inicio'); return; }
  if (!r.publico){
    if (!S.sesion){ Nav.ir('#/login'); return; }
    if (S.sesion.mfaPendiente && !r.mfa){ Nav.ir('#/mfa'); return; }
    if (r.mfa && !S.sesion.mfaPendiente){ Nav.ir('#/inicio'); return; }
    if (r.roles && !r.roles.includes(S.sesion.rol)){ render(vDenegado()); return; }
  }
  const m = h.match(r.p);
  try { render(r.v(...m.slice(1))); }
  catch (x){ render({titulo: 'Error', atras: '#/inicio', html: `<section class="wrap"><h2>No se pudo mostrar la pantalla</h2><div class="alert bad" role="alert">${esc(x.message)}</div><a class="btn primary" href="#/inicio">Ir al inicio</a></section>`}); }
}

async function autoprueba(){

  document.body.appendChild(capa);
  const pintar = () => { const okN = R.pasos.filter(p => p.ok).length;
    capa.innerHTML = `<section class="wrap"><h2>Autoprueba de OralIA ${VERSION}</h2><p class="small muted">${esc(R.entorno.ua)} · ${R.entorno.ancho}×${R.entorno.alto}</p>

    <p id="autopruebaFin" class="${R.fin ? (okN === R.pasos.length ? 'alert ok' : 'alert bad') : 'alert info'}" role="status">${R.fin ? `Terminado: ${okN} de ${R.pasos.length} pasos correctos.` : 'Probando…'}</p>
    ${R.fin ? '<button class="btn primary" type="button" id="autopruebaCerrar">Cerrar</button>' : ''}</section>`;
    const c = $('#autopruebaCerrar', capa); if (c) c.onclick = () => { capa.remove(); router(); }; };
  const paso = async (nombre, fn) => { const t0 = performance.now(); pintar();
    try { const v = await fn(); R.pasos.push({nombre, ok: true, detalle: String(v ?? ''), ms: Math.round(performance.now() - t0)}); }
    catch (e){ R.pasos.push({nombre, ok: false, detalle: (e && e.message) || String(e), ms: Math.round(performance.now() - t0)}); }
    pintar(); };
  const sesion = S.sesion, ruta = Nav.actual();

  await paso('Motor de IA', async () => { await AIEngine.cargar(); return `listo en ${AIEngine.carga_ms} ms`; });

      if (Math.abs(r.prob_malignidad - esp) > 0.05) throw new Error(`probabilidad ${num(r.prob_malignidad, 3)}, se esperaba cerca de ${num(esp, 3)}`);
      return `probabilidad ${num(r.prob_malignidad, 3)} (esperada ${num(esp, 3)}), inferencia ${r.tiempo_inferencia_ms} ms`; });
  }
  await paso('Navegación entre pantallas', async () => { Api.logout(); Nav.ir('#/login'); await sleep(60); Nav.ir('#/guia'); await sleep(60);
    if (!$('#guia')) throw new Error('no se mostró la guía'); Nav.ir('#/login'); await sleep(60); if (!$('#fLogin')) throw new Error('no volvió al ingreso'); return 'ingreso → guía → ingreso'; });

    $('#fLogin button[type="submit"]').click(); const t0 = Date.now(); while (!$('#loginError').textContent && Date.now() - t0 < 4000) await sleep(50);

    const otra = await AIEngine.esBoca(await cargarImagen(aDataUrl(fotoNoBoca())));
    if (!boca.boca) throw new Error('rechazó una foto de la boca (' + boca.ood + ')');
    if (otra.boca) throw new Error('aceptó una imagen que no es de la boca (' + otra.ood + ')');
    return `foto de la boca aceptada (${num(boca.ood)}) y paisaje rechazado (${num(otra.ood)}), umbral ${num(MODELO.umbral_boca)}`; });
  await paso('Correo protegido', async () => {
    const clave = claveAleatoria(); const marca = 'PRUEBA-' + clave;
    const pdf = await Report.construir([{t: marca, x: 40, y: 800}], null, clave); const txt = String.fromCharCode(...pdf);
    const u = /\/U <([0-9a-f]{96})>/.exec(txt); if (!u || !/\/AESV3/.test(txt) || !/\/Encrypt 8 0 R/.test(txt)) throw new Error('el PDF no quedó cifrado');
    if (txt.includes(marca)) throw new Error('el texto quedó legible dentro del PDF');
    const U = Uint8Array.from(u[1].match(/../g), h => parseInt(h, 16));
    if (!(await PdfCripto.comprobar(clave, U))) throw new Error('la clave correcta no abre el PDF');
    if (await PdfCripto.comprobar('OTRA-CLAVE', U)) throw new Error('una clave incorrecta abre el PDF');
    const t = textoCorreo({codigo: 'A00'}); if (/riesgo|probabilidad|alto|cáncer/i.test(t.asunto + t.cuerpo)) throw new Error('el texto del correo lleva datos de salud');
    return 'PDF cifrado con AES-256: abre solo con su clave y el texto del correo no lleva datos de salud'; });
  await paso('Base de datos compartida', async () => {
    { const t0 = Date.now(); while (!Nube.decidido && Date.now() - t0 < 6000) await sleep(100); }
    if (!Nube.modo) return 'no hay base en este modo: los datos quedan en este equipo';
    const t0 = Date.now(); while (Nube.estado === 'conectando' || (Nube.db && Nube.primeros.size < Object.keys(COLS).length)){ if (Date.now() - t0 > 12000) break; await sleep(100); }
    if (!Nube.db) throw new Error('la base no respondió (estado ' + Nube.estado + ')');
    const ref = Nube.db.doc('autoprueba/ultima'); if (Nube.estado === 'compartido'){ await ref.set({ts: Date.now(), disp: S.disp || ''}); }
    const sn = await ref.get(); if (Nube.estado === 'compartido' && !sn.exists) throw new Error('el documento de prueba no se pudo leer de vuelta'); return `${Nube.modo === 'internet' ? 'base de OralIA en internet' : 'base del artefacto de Claude'}: ${Nube.texto()}, ${Nube.primeros.size} colecciones leídas, documento de prueba escrito y leído`; });
  await paso('Caso completo y sincronización', async () => {
    await Api.login(DEMO.Paciente[0], DEMO.Paciente[1], true); const f = Api.nuevoCaso();
    const c = await ejemplo('ejemplo_lesion'); const img = await cargarImagen(aDataUrl(c)); const q = Validator.validarCalidad(img);
    S.borrador.foto = Object.assign({dataUrl: await reducir(img), formato: 'JPG', estado_validacion: q.apta ? 'Aprobada' : 'Rechazada'}, q);
    Object.assign(S.borrador.datos, {edad: 58, sexo: 'Masculino', tiempo_evolucion: 'Más de 4 semanas', dolor_eva: 5, sangrado: true, consumo_tabaco: true, consumo_alcohol: 'Frecuente'});
    const r = await Api.enviarAnalisis(); if (r.rechazado || r.encolado) throw new Error(r.rechazado ? 'foto rechazada' : 'caso en cola sin conexión');
    const rep = await Api.ejecutarAnalisis(r.id_ficha); let nube = 'sin base';
    const quitar = () => { const ft = fotoDe(f.id_ficha); S.fichas = S.fichas.filter(x => x.id_ficha !== f.id_ficha); S.reportes = S.reportes.filter(x => x.id_ficha !== f.id_ficha);
      if (ft){ S.analisis = S.analisis.filter(x => x.id_foto !== ft.id_foto); S.fotos = S.fotos.filter(x => x.id_foto !== ft.id_foto); }
      S.notificaciones = S.notificaciones.filter(n => !n.texto.includes('#' + f.codigo)); persist(); };
    try {
      if (Nube.estado === 'compartido'){
        Nube.programar(); const t0 = Date.now(); let ok = false;
        while (Date.now() - t0 < 15000){ await sleep(300); const b = Nube.base(); if (b.fichas[f.id_ficha] && b.reportes[rep.id_reporte]){ ok = (await Nube.db.doc('fichas/' + f.id_ficha).get()).exists; if (ok) break; } }
        if (!ok) throw new Error('el caso no llegó a la base en 15 s');
        nube = 'guardado en la base y borrado al terminar';
      }
      return `caso #${f.codigo}, riesgo ${rep.nivel_riesgo}, ${nube}`;
    } finally {
      quitar();
      if (Nube.estado === 'compartido'){ Nube.programar(); const t0 = Date.now(); while (Date.now() - t0 < 15000 && (Nube.base().fichas[f.id_ficha] || Nube.base().reportes[rep.id_reporte])) await sleep(200); }
    }
  });
  await paso('Descarga del PDF', async () => Nube.dl ? 'disponible: Claude pide confirmar cada descarga' : (enMarcoAislado() ? 'este marco puede bloquear descargas: abra OralIA en el navegador' : 'descarga normal del navegador'));
  Api.logout(); S.sesion = sesion; persist(); Nav.ruta = null; Nav.ir(ruta);
  R.fin = new Date().toISOString(); pintar();
  if (Nube.db && Nube.estado === 'compartido'){ try { await Nube.db.doc('autoprueba/resultado-' + (S.disp || sufijoDisp())).set(JSON.parse(JSON.stringify(R))); } catch (e) {} }
  document.documentElement.dataset.autoprueba = R.pasos.every(p => p.ok) ? 'ok' : 'falla';
  return R;
}

/* ------------------------- Arranque ------------------------- */
async function iniciar(){
  S = Store.load();
  if (!S || S.version !== 2) await sembrar();
  window.addEventListener('hashchange', () => { const h = location.hash; if (/^#\//.test(h) && h !== Nav.ruta){ Nav.ruta = h; router(); } });
  document.addEventListener('click', ev => {
    const a = ev.target.closest && ev.target.closest('a[href^="#/"]');
    if (a && !ev.defaultPrevented && ev.button === 0 && !ev.ctrlKey && !ev.metaKey){ ev.preventDefault(); Nav.ir(a.getAttribute('href')); return; }
    // Formularios: en un marco con sandbox el envío nativo no ocurre, así que el botón dispara el evento submit.
    const b = ev.target.closest && ev.target.closest('button[type="submit"], input[type="submit"]');
    if (b && b.form && !b.disabled){ ev.preventDefault(); b.form.dispatchEvent(new Event('submit', {bubbles: true, cancelable: true})); }
  }, true);
  $('#btnAyuda').onclick = () => { if (Nav.actual() !== '#/guia') Nav.ir('#/guia'); };
  window.addEventListener('online', () => { actualizarRed(); Sync.procesar(); });
  window.addEventListener('offline', actualizarRed);
  let ancho = matchMedia('(min-width:900px)').matches;
  window.addEventListener('resize', () => { const a = matchMedia('(min-width:900px)').matches; if (a !== ancho){ ancho = a; if (/^#\/casos/.test(Nav.actual())) router(); } });
  router(); Sync.procesar(); Nube.iniciar().catch(() => {});
  const verAuto = () => { if (location.hash === '#autoprueba') autoprueba().catch(() => {}); };
  setTimeout(verAuto, 300); setTimeout(verAuto, 2000); window.addEventListener('hashchange', verAuto);
  document.documentElement.dataset.listo = '1';
  setTimeout(() => { AIEngine.cargar().catch(() => {}); }, 400);
}
window.OralIA = {autoprueba, Nube, Nav, Api, Validator, AIEngine, RiskEngine, Report, Estado, Store, Config, Sync, MODELO, CALIDAD_FOTO, ejemplo, ejemplosReales, contornoDesdeMapa, cargarImagen, rutValido, ejemplosDe, NO_BOCA, aDataUrl, PdfCripto, textoCorreo, enmascarar, version: VERSION, get estado(){ return S; }};
iniciar();
})();
